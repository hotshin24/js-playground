<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M0 스파이크 — 실행 엔진 프로토타입</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <main id="main">
    <h1>M0 스파이크 — 실행 엔진 프로토타입</h1>

    <label class="label" for="code">JS 코드</label>
    <textarea id="code" class="code-input" rows="12" spellcheck="false" autocomplete="off">const user = { name: '호진', tags: ['js', 'react'] };
console.log('안녕', user);
console.warn('경고 한 줄');
</textarea>
    <p class="hint">실행: 아래 버튼 또는 <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd></p>
    <button id="run" class="run-button" type="button">실행</button>

    <h2>콘솔</h2>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ol id="log" class="log" role="log" aria-label="콘솔 출력"></ol>
  </main>

  <div id="sandbox-host" class="sandbox-host" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
