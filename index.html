<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS 학습 플레이그라운드</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <main id="main" class="layout">
    <section class="panel panel--brief" id="brief-panel" aria-labelledby="lesson-title">
      <nav class="lesson-nav" aria-label="레슨 목록">
        <h2 class="nav-heading">레슨</h2>
        <ol id="lesson-list" class="lesson-list"></ol>
      </nav>

      <h1 id="lesson-title">레슨을 불러오는 중…</h1>
      <div id="lesson-brief" class="lesson-brief"></div>
    </section>

    <section class="panel panel--editor" aria-labelledby="editor-heading">
      <div class="panel-head">
        <h2 id="editor-heading">코드</h2>
        <button id="brief-toggle" class="button button--toggle" type="button"
                aria-expanded="true" aria-controls="brief-panel">문제 숨기기</button>
      </div>

      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <div id="editor-host" class="editor-host"></div>
      <pre id="readonly-code" class="readonly-code" tabindex="0" aria-label="레슨 코드 (읽기 전용)" hidden></pre>

      <p id="editor-hint" class="hint">
        Tab은 들여쓰기입니다. <kbd>Esc</kbd>를 누른 뒤 <kbd>Tab</kbd>을 누르면 편집기 밖으로 이동합니다.
      </p>

      <div class="button-row">
        <button id="run" class="button button--primary" type="button" disabled>실행</button>
        <button id="reset" class="button" type="button" disabled>초기 코드로 되돌리기</button>
      </div>
    </section>

    <section class="panel panel--result" aria-labelledby="result-heading">
      <h2 id="result-heading">검사 결과</h2>
      <p id="assert-summary" class="status" role="status" aria-live="polite"></p>
      <ol id="asserts" class="assert-list"></ol>

      <h2>콘솔</h2>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ol id="log" class="log" role="log" aria-label="콘솔 출력"></ol>
    </section>
  </main>

  <div id="sandbox-host" class="sandbox-host" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
