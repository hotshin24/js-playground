<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS 학습 플레이그라운드</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <main id="main">
    <h1 id="lesson-title">레슨을 불러오는 중…</h1>
    <div id="lesson-brief" class="lesson-brief"></div>

    <label class="label" for="code">코드</label>
    <textarea id="code" class="code-input" rows="12" spellcheck="false" autocomplete="off"></textarea>
    <p class="hint">실행: 실행 버튼 또는 <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd></p>

    <div class="button-row">
      <button id="run" class="button button--primary" type="button" disabled>실행</button>
      <button id="reset" class="button" type="button" disabled>초기 코드로 되돌리기</button>
    </div>

    <h2>검사 결과</h2>
    <p id="assert-summary" class="status" role="status" aria-live="polite"></p>
    <ol id="asserts" class="assert-list"></ol>

    <h2>콘솔</h2>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ol id="log" class="log" role="log" aria-label="콘솔 출력"></ol>
  </main>

  <div id="sandbox-host" class="sandbox-host" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
